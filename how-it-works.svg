<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Public Sans, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Crosscheck works</title>
  <desc id="d">Three inputs: radio and intercom audio through Muse Voice Transcribe into said facts; a panel camera read by on-device text recognition or Muse Spark into set and doing facts; an optional pilot camera through SAM 3D Body into posture. All go into one ledger, deterministic rules compare them, and a callout is spoken in standard words and shown on a tablet. The simulator's own data goes only to the scorer.</desc>
  <rect width="1200" height="520" rx="14" fill="#eceee9"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15181b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a8077"/></marker>
  </defs>

  <!-- inputs -->
  <g font-size="15">
    <text x="40" y="52" font-size="13" fill="#4a5057">What it hears and sees</text>
    <rect x="40" y="70" width="250" height="78" rx="8" fill="#fff" stroke="#b8bdb3"/>
    <text x="58" y="100" font-weight="700" fill="#15181b">Radio and intercom</text>
    <text x="58" y="124" fill="#4a5057" font-size="14">one audio channel each</text>

    <rect x="40" y="178" width="250" height="78" rx="8" fill="#fff" stroke="#b8bdb3"/>
    <text x="58" y="208" font-weight="700" fill="#15181b">Panel camera</text>
    <text x="58" y="232" fill="#4a5057" font-size="14">the flight displays and gauges</text>

    <rect x="40" y="286" width="250" height="78" rx="8" fill="#fff" stroke="#b8bdb3" stroke-dasharray="5 4"/>
    <text x="58" y="316" font-weight="700" fill="#15181b">Pilot camera</text>
    <text x="58" y="340" fill="#4a5057" font-size="14">optional, on the glareshield</text>
  </g>

  <!-- models -->
  <g font-size="15">
    <text x="350" y="52" font-size="13" fill="#4a5057">Meta models</text>
    <rect x="350" y="70" width="250" height="78" rx="8" fill="#fff" stroke="#1d5f9c" stroke-width="1.5"/>
    <text x="368" y="100" font-weight="700" fill="#1d5f9c">Muse Voice Transcribe</text>
    <text x="368" y="124" fill="#4a5057" font-size="14">transcripts, values parsed by code</text>

    <rect x="350" y="178" width="250" height="78" rx="8" fill="#fff" stroke="#9c1f8c" stroke-width="1.5"/>
    <text x="368" y="208" font-weight="700" fill="#9c1f8c">Muse Spark</text>
    <text x="368" y="232" fill="#4a5057" font-size="14">or on-device text recognition</text>

    <rect x="350" y="286" width="250" height="78" rx="8" fill="#fff" stroke="#15181b" stroke-width="1.5"/>
    <text x="368" y="316" font-weight="700" fill="#15181b">SAM 3D Body</text>
    <text x="368" y="340" fill="#4a5057" font-size="14">body pose, then head and hands</text>
  </g>
  <g stroke="#15181b" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M290 109H344"/><path d="M290 217H344"/><path d="M290 325H344"/>
  </g>

  <!-- ledger -->
  <rect x="660" y="70" width="230" height="294" rx="10" fill="#15181b"/>
  <text x="680" y="104" font-size="17" font-weight="700" fill="#fff">Ledger</text>
  <text x="680" y="128" font-size="13" fill="#b8bdb3">facts with a time and a source</text>
  <g font-size="15" font-weight="700">
    <text x="680" y="172" fill="#6cc4ff">Said</text><text x="740" y="172" font-weight="400" font-size="13" fill="#d9dcd6">clearance 11,000</text>
    <text x="680" y="212" fill="#f062e0">Set</text><text x="740" y="212" font-weight="400" font-size="13" fill="#d9dcd6">MCP 12,000</text>
    <text x="680" y="252" fill="#ffffff">Doing</text><text x="740" y="252" font-weight="400" font-size="13" fill="#d9dcd6">climbing through 9,600</text>
    <text x="680" y="292" fill="#3ddc84">Pilot</text><text x="740" y="292" font-weight="400" font-size="13" fill="#d9dcd6">upright</text>
  </g>
  <text x="680" y="340" font-size="12" fill="#b8bdb3">Never the aircraft's own data</text>
  <g stroke="#15181b" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M600 109H654"/><path d="M600 217H654"/><path d="M600 325H654"/>
  </g>

  <!-- rules and callout -->
  <rect x="940" y="70" width="220" height="130" rx="8" fill="#fff" stroke="#b8bdb3"/>
  <text x="958" y="100" font-size="15" font-weight="700" fill="#15181b">Rules</text>
  <text x="958" y="124" font-size="14" fill="#4a5057">said against set,</text>
  <text x="958" y="144" font-size="14" fill="#4a5057">set against doing,</text>
  <text x="958" y="164" font-size="14" fill="#4a5057">mode against phase</text>
  <text x="958" y="186" font-size="12" fill="#4a5057">deterministic, instant</text>
  <path d="M890 135H934" stroke="#15181b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="940" y="234" width="220" height="130" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="958" y="264" font-size="15" font-weight="700" fill="#b3261e">Callout</text>
  <text x="958" y="290" font-size="14" font-style="italic" fill="#15181b">“Cleared one-one</text>
  <text x="958" y="310" font-size="14" font-style="italic" fill="#15181b">thousand, set one-two</text>
  <text x="958" y="330" font-size="14" font-style="italic" fill="#15181b">thousand.”</text>
  <text x="958" y="352" font-size="12" fill="#4a5057">spoken (MMS-TTS) and on a tablet</text>
  <path d="M1050 200V228" stroke="#15181b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- scoring -->
  <rect x="40" y="420" width="1120" height="64" rx="8" fill="none" stroke="#7a8077" stroke-dasharray="5 4"/>
  <text x="58" y="448" font-size="15" font-weight="700" fill="#4a5057">X-Plane 12's own data, logged at 10 Hz</text>
  <text x="58" y="470" font-size="14" fill="#4a5057">used only by the scorer, to grade each run: did it speak, when, and before the point of no return?</text>
  <path d="M1050 364V414" stroke="#7a8077" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="1060" y="398" font-size="12" fill="#4a5057">scored</text>
</svg>
