[project]
name = "crosscheck"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.42.0",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
eval = [
    "jiwer>=4.0.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
