<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crosscheck Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c; --panel: #0f141a; --line: #222b36; --text: #eef2f6; --muted: #93a0ae; --faint: #7f8a97;
  --said: #79b8ff; --set: #e46bf0; --ok: #4fd18b; --callout: #ff5c5c;
  /* B612: the typeface Airbus commissioned for cockpit displays; tabular figures so values do not jump */
  --sans: "B612", "Helvetica Neue", Arial, sans-serif; --mono: "B612", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 var(--sans); font-variant-numeric: tabular-nums; }
body { display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); min-height: 100vh; }
.top { display: flex; align-items: center; gap: 14px; }
.brand { font-weight: 700; font-size: 17px; }
.scn { color: var(--muted); font-size: 14px; }
.spacer { flex: 1; }
.conn { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.conn.on i { background: var(--ok); }
.clock { font: 500 14px var(--mono); color: var(--muted); }

.status { border-radius: 14px; padding: 18px 22px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  background: rgba(79,209,139,.08); border: 1px solid rgba(79,209,139,.45); transition: background .2s, border-color .2s; }
.explain { margin-top: 10px; max-width: 60ch; }
.explain span { font-size: 12px; color: var(--muted); }
.explain p { margin: 2px 0 0; font-size: 17px; line-height: 1.4; color: var(--text); }
.status .what { font: 600 30px/1.15 var(--sans); color: var(--ok); }
.status .why { color: var(--muted); margin-top: 4px; font-size: 15px; }
.status.alert { background: rgba(255,92,92,.12); border-color: var(--callout); }
.status.alert .what { color: var(--text); }
.status.alert .why { color: #ffc4c4; }
.status.flash { animation: flash .9s ease-out 2; }
@keyframes flash { 0% { background: rgba(255,92,92,.45); } 100% { background: rgba(255,92,92,.12); } }
.cam { width: 240px; aspect-ratio: 2 / 1; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--line); }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; }

.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; min-height: 0; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lab { font: 600 12px var(--mono); letter-spacing: .14em; }
.row .k { color: var(--muted); font-size: 13px; }
.row .v { font: 500 34px/1.1 var(--mono); }
.row .v.small { font-size: 22px; }
.row .v.mode { font-size: 24px; letter-spacing: .04em; }
.row .v.blank { color: var(--callout); }
.k-said { color: var(--said); } .k-set { color: var(--set); }
.set .v { color: var(--set); }
.tx { padding: 2px 0; }
.tx .who { font: 500 11px var(--mono); color: var(--said); letter-spacing: .08em; }
.tx .q { font-size: 17px; margin-top: 2px; }
.tx .f { font: 500 14px var(--mono); color: var(--said); margin-top: 4px; }
.empty { color: var(--faint); }

.log { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; max-height: 26vh; overflow: auto; }
.log ol { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.log li { display: grid; grid-template-columns: 64px 92px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid #18202a; }
.log li:last-child { border-bottom: 0; }
.log .t { font: 500 13px var(--mono); color: var(--faint); }
.log .kind { font: 600 11px var(--mono); letter-spacing: .08em; padding-top: 2px; }
.log .callout .kind { color: var(--callout); } .log .heard .kind { color: var(--said); } .log .cleared .kind { color: var(--ok); } .log .action .kind { color: var(--muted); }

@media (max-width: 820px) {
  body { display: flex; flex-direction: column; }
  body > * { flex: none; }
  .log { max-height: none; }
  .cols { grid-template-columns: 1fr; }
  .status { grid-template-columns: 1fr; }
  .cam { width: 100%; }
  .explain { margin-top: 10px; max-width: 60ch; }
.explain span { font-size: 12px; color: var(--muted); }
.explain p { margin: 2px 0 0; font-size: 17px; line-height: 1.4; color: var(--text); }
.status .what { font-size: 24px; }
  .row .v { font-size: 28px; }
}
</style>
</head>
<body>
  <div class="top">
    <span class="brand">Crosscheck</span><span class="scn" id="scn">waiting for a run…</span>
    <span class="spacer"></span><span class="clock" id="clock"></span>
    <span class="conn" id="conn"><i></i><span id="connText">connecting</span></span>
  </div>

  <section class="status" id="status" role="status" aria-live="assertive">
    <div><div class="what" id="what">Monitoring</div><div class="why" id="why">Said, set and doing agree.</div>
      <div class="explain" id="explain" hidden><span>Muse Spark</span><p id="explainText"></p></div></div>
    <div class="cam"><img id="cam" alt="Latest camera frame of the cockpit displays" hidden></div>
  </section>

  <section class="cols">
    <div class="col"><div class="lab k-said">SAID</div><div id="said"><div class="empty">Nothing said yet.</div></div></div>
    <div class="col set"><div class="lab k-set" id="setLab">SET</div><div id="setRows"></div></div>
    <div class="col"><div class="lab" id="doLab">DOING</div><div id="doRows"></div></div>
  </section>

  <section class="log"><ol id="log"></ol></section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ft = v => v == null ? "—" : Math.round(v).toLocaleString("en-US");
const WHO = {atc: "ATC · RADIO", pm: "CREW · INTERCOM", pf: "CREW · INTERCOM", capt: "CAPTAIN · INTERCOM"};
const KEYS = {"clearance.altitude": "clearance", "readback.altitude": "readback", "callout.flaps": "callout flaps", "pilot.voice": "the captain answered"};
let scenario = null, t0 = null, lastT = null, active = new Map(), heard = [], facts = [], layout = null, explains = new Map();
// what the Set and Doing columns show, per scenario: [label, field, css class]
const LAYOUTS = {
  altitude: {set: ["SET", [["MCP altitude", "selAlt", ""], ["MCP speed", "selSpd", "small"]]], doing: ["DOING", [["Altitude", "alt", ""], ["Airspeed", "ias", "small"], ["Track", "trk", "small"]]]},
  autothrottle_hold: {set: ["SET", [["MCP speed", "selSpd", ""], ["Thrust mode", "thr", "mode"]]], doing: ["DOING", [["Airspeed", "ias", ""], ["Altitude", "alt", "small"]]]},
  flaps: {set: ["SET", [["Flaps called", "called", ""], ["Flap lever", "lever", "small"]]], doing: ["DOING", [["Flap gauge", "flp", ""], ["Needle", "clock", "small"]]]},
  pilot_watch: {set: ["HEAD · SAM 3D Body", [["Neck flexion", "neck", ""], ["Alert above", "neckMax", "small"]]], doing: ["HANDS · SAM 3D Body", [["Height above the hips", "wrists", ""], ["Alert below", "wristMin", "small"]]]},
};
LAYOUTS.nominal = LAYOUTS.altitude;
const RULES = {clearance_vs_set: "MCP against the clearance", readback_vs_clearance: "Readback against the clearance",
  callout_vs_set: "Flap callout against the gauge", mode_vs_phase: "Autothrottle mode on final", pilot_watch: "Pilot camera"};
function setLayout(kind) {
  layout = LAYOUTS[kind] || LAYOUTS.altitude;
  const rows = r => r.map(([k, id, cls]) => `<div class="row"><div class="k">${k}</div><div class="v ${cls}" id="${id}">—</div></div>`).join("");
  $("setLab").textContent = layout.set[0]; $("setRows").innerHTML = rows(layout.set[1]);
  $("doLab").textContent = layout.doing[0]; $("doRows").innerHTML = rows(layout.doing[1]);
  if (kind === "flaps") $("lever").textContent = "not in the camera's view";
  if (kind === "pilot_watch") { $("neckMax").textContent = "40°"; $("wristMin").textContent = "0.31"; }
}
const put = (id, v) => { const el = $(id); if (el && v != null) el.textContent = v; };

function reset(d) {
  scenario = d.scenario; t0 = null; active.clear(); heard = []; facts = []; explains.clear();
  const re = scenario.endsWith("_reenacted"), base = scenario.replace(/_reenacted$/, "").replace(/_mic$/, "");
  const name = base.replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
  $("scn").textContent = name + (re ? " · re-enacted from the recording" : scenario.endsWith("_mic") ? " · live voice" : "");
  setLayout((d.meta || {}).scorer);
  $("log").innerHTML = ""; $("cam").hidden = true; renderSaid(); renderStatus();
}
const rel = t => t0 == null ? 0 : t - t0;
function logLine(kind, t, text) {
  const li = document.createElement("li"); li.className = kind;
  li.innerHTML = `<span class="t">${rel(t).toFixed(1)} s</span><span class="kind">${kind.toUpperCase()}</span><span>${text}</span>`;
  $("log").prepend(li);
  while ($("log").children.length > 40) $("log").lastChild.remove();
}
function renderSaid() {
  if (!heard.length) { $("said").innerHTML = `<div class="empty">Nothing said yet.</div>`; return; }
  $("said").innerHTML = heard.slice(-3).reverse().map(h => {
    const f = facts.filter(f => Math.abs(f.t - h.t) < 0.05 && f.speaker === h.speaker);
    return `<div class="tx"><div class="who">${WHO[h.speaker] || esc(h.speaker)}</div><div class="q">“${esc(h.transcript.trim())}”</div>
      ${f.length ? f.map(x => `<div class="f">→ ${KEYS[x.key] || esc(x.key)} ${x.key === "callout.flaps" ? x.value : x.key === "pilot.voice" ? "" : ft(x.value) + " ft"}</div>`).join("") : `<div class="f" style="color:var(--faint)">no value for us</div>`}</div>`;
  }).join(`<div style="height:10px"></div>`);
}
function renderStatus(fresh) {
  const s = $("status");
  if (active.size) {
    const c = [...active.values()].pop();
    s.classList.add("alert"); $("what").textContent = `“${c.callout}”`;
    const v = x => typeof x === "number" && x >= 1000 ? ft(x) + " ft" : String(x).toLowerCase();
    $("why").textContent = `${RULES[c.rule] || c.rule.replace(/_/g, " ")}: expected ${v(c.expected)}, found ${v(c.actual)}`;
    if (fresh) { s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); }
    const x = explains.get(c.rule + "/" + c.key);
    $("explain").hidden = !x; if (x) $("explainText").textContent = x;
  } else {
    s.classList.remove("alert", "flash"); $("what").textContent = "Monitoring"; $("why").textContent = "Said, set and doing agree.";
    $("explain").hidden = true;
  }
}
function onEvent(e) {
  if (t0 == null) t0 = e.t;
  lastT = e.t; $("clock").textContent = rel(e.t).toFixed(0) + " s";
  if (e.kind === "reading") {
    if (e.selected_altitude != null) put("selAlt", ft(e.selected_altitude));
    if (e.selected_speed != null) put("selSpd", e.selected_speed + " kt");
    if (e.fma && e.fma.some(Boolean)) { const m = e.fma[0] || "BLANK"; put("thr", m); if ($("thr")) $("thr").classList.toggle("blank", m === "BLANK"); }
    if (e.altitude != null) put("alt", ft(e.altitude) + " ft");
    if (e.ias != null) put("ias", e.ias + " kt");
    if (e.track_mag != null) put("trk", String(Math.round(e.track_mag)).padStart(3, "0") + "°");
    if (e.flaps != null) put("flp", e.flaps === 0 ? "UP" : "Flaps " + e.flaps);
    if (e.flaps_clock != null) put("clock", `${(((e.flaps_clock - 1) % 12) + 1).toFixed(1)} o\u2019clock`);
    if (e.frame) { $("cam").src = `/frame/${scenario}/${e.frame.split("/").pop()}`; $("cam").hidden = false; }
  } else if (e.kind === "pilot") {  // the opt-in pilot camera: posture from SAM 3D Body
    put("neck", Math.round(e.neck_flex) + "°"); put("wrists", e.wrists.toFixed(2));
    if ($("neck")) $("neck").classList.toggle("blank", e.neck_flex > 40);
    if ($("wrists")) $("wrists").classList.toggle("blank", e.wrists < 0.31);
    if (e.frame) { $("cam").src = `/frame/${scenario}/${e.frame.split("/").pop()}`; $("cam").hidden = false; }
  } else if (e.kind === "heard") {
    heard.push(e); renderSaid(); logLine("heard", e.t, `${esc(WHO[e.speaker] || e.speaker)}: “${esc(e.transcript.trim())}”`);
  } else if (e.kind === "said") {
    facts.push(e); renderSaid();
    if (e.key === "callout.flaps") put("called", "Flaps " + e.value);
  } else if (e.kind === "callout") {
    active.set(e.rule + "/" + e.key, e); renderStatus(true); logLine("callout", e.t, `“${esc(e.callout)}”`);
  } else if (e.kind === "explain") {  // Muse Spark's sentence under the callout (brain/explain.py)
    if (e.text) { explains.set(e.rule + "/" + e.key, e.text); renderStatus(); logLine("explain", e.t, esc(e.text)); }
  } else if (e.kind === "cleared") {
    active.delete(e.rule + "/" + e.key); renderStatus(); logLine("cleared", e.t, esc(e.rule.replace(/_/g, " ")));
  } else if (e.kind === "action") {
    logLine("action", e.t, esc(e.line));
  }
}
function connect() {
  const es = new EventSource("/stream");
  es.onopen = () => { $("conn").classList.add("on"); $("connText").textContent = "live"; };
  es.onerror = () => { $("conn").classList.remove("on"); $("connText").textContent = "reconnecting"; };
  es.addEventListener("reset", m => reset(JSON.parse(m.data)));
  es.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (err) { console.error(err); } };
}
connect();
</script>
</body>
</html>
